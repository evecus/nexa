name: build
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.0)，留空则自动生成'
        required: false
        default: 'mipsel'
        type: string
permissions:
  contents: write
jobs:
  build:
    name: build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 / ARM 64 位
          - goos: linux
            goarch: amd64
            asset_suffix: linux-x86_64
          - goos: linux
            goarch: arm64
            asset_suffix: linux-aarch64
          # x86 32 位（老 NAS / 旧 Linux 主机）
          - goos: linux
            goarch: 386
            asset_suffix: linux-i386
          # ARM 32 位：armv5 兼容最广（软浮点，跑在 v5+ 全系），armv7 面向较新设备
          - goos: linux
            goarch: arm
            goarm: '5'
            asset_suffix: linux-armv5
          - goos: linux
            goarch: arm
            goarm: '7'
            asset_suffix: linux-armv7
          # MIPS 32 位（软浮点，OpenWrt 路由器主流）
          - goos: linux
            goarch: mips
            gomips: softfloat
            asset_suffix: linux-mips
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            asset_suffix: linux-mipsle
          # MIPS 64 位：硬浮点（原有条目）+ 软浮点（多数路由器 SoC 无 FPU）
          - goos: linux
            goarch: mips64
            asset_suffix: linux-mips64
          - goos: linux
            goarch: mips64
            gomips64: softfloat
            asset_suffix: linux-mips64-sf
          - goos: linux
            goarch: mips64le
            asset_suffix: linux-mips64le
          - goos: linux
            goarch: mips64le
            gomips64: softfloat
            asset_suffix: linux-mips64le-sf
          # RISC-V / LoongArch / PowerPC / s390x
          - goos: linux
            goarch: riscv64
            asset_suffix: linux-riscv64
          - goos: linux
            goarch: loong64
            asset_suffix: linux-loong64
          - goos: linux
            goarch: ppc64le
            asset_suffix: linux-ppc64le
          - goos: linux
            goarch: s390x
            asset_suffix: linux-s390x
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      - run: go mod tidy
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
          CGO_ENABLED: '0'
          GOPROXY: https://goproxy.cn,direct
        run: |
          go build -trimpath -ldflags='-s -w -X main.version=${GITHUB_REF_NAME:-dev}' -o nexa ./cmd/nexa
          file nexa
      - name: package
        run: |
          cp nexa nexa-${{ matrix.asset_suffix }}
          ls -lh nexa-${{ matrix.asset_suffix }}
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: "nexa v${{ github.event.inputs.version }}"
          files: |
            nexa-${{ matrix.asset_suffix }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
